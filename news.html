<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OKUBI — News</title>
  <meta name="description" content="Latest news and updates from the world of OKUBI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .news-layout { max-width: 100%; margin: 0 auto; padding: 80px 200px 200px; }
    /* Top row: featured left + 2 stacked right */
    .news-top { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px; }
    .news-top__featured {
      position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
      transition: filter 0.15s;
    }
    .news-top__featured:hover { filter: brightness(1.1); }
    .news-top__featured-img {
      width: 100%; height: 100%; min-height: 480px; object-fit: cover; display: block;
    }
    .news-top__featured-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 40%, transparent 70%);
    }
    .news-top__featured-content {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 28px;
    }
    .news-top__featured-date {
      font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; color: #aaa; margin-bottom: 6px;
    }
    .news-top__featured-title {
      font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: #f59e0b; line-height: 1.3;
    }
    .news-top__featured-excerpt {
      font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #999; margin-top: 8px; line-height: 1.4;
    }

    /* Stacked right cards */
    .news-top__side { display: flex; flex-direction: column; gap: 24px; }
    .news-side-card {
      position: relative; border-radius: 8px; overflow: hidden; flex: 1; cursor: pointer;
      transition: filter 0.15s;
    }
    .news-side-card:hover { filter: brightness(1.1); }
    .news-side-card__img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .news-side-card__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 50%, transparent 80%);
    }
    .news-side-card__content { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; }
    .news-side-card__sub {
      font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #bbb; margin-bottom: 4px;
    }
    .news-side-card__title {
      font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #f59e0b; line-height: 1.3;
    }

    /* Bottom grid: 3 columns */
    .news-bottom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .news-grid-card {
      position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
      transition: filter 0.15s;
    }
    .news-grid-card:hover { filter: brightness(1.1); }
    .news-grid-card__img {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    }
    .news-grid-card__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 50%, transparent 80%);
    }
    .news-grid-card__content { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; }
    .news-grid-card__sub {
      font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #bbb; margin-bottom: 4px;
    }
    .news-grid-card__title {
      font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #f59e0b; line-height: 1.3;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .news-top { grid-template-columns: 1fr; }
      .news-top__featured-img { min-height: 300px; }
      .news-top__side { flex-direction: row; }
      .news-bottom { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .news-top__side { flex-direction: column; }
      .news-bottom { grid-template-columns: 1fr; }
    }

    /* Loading / empty states */
    .news-loading {
      text-align: center; color: #888; padding: 120px 24px;
      font-family: 'Rajdhani', sans-serif; font-size: 1.1rem;
    }

    /* Older news list */
    .news-older { margin-top: 60px; padding-top: 40px; border-top: 1px solid #1e1e30; }
    .news-older__title {
      font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #888;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px;
    }
    .news-older__item {
      display: flex; gap: 24px; padding: 24px 0;
      border-bottom: 1px solid #1a1a2a; cursor: pointer;
      transition: background 0.15s; text-decoration: none;
    }
    .news-older__item:hover { background: rgba(255,255,255,0.02); }
    .news-older__img {
      width: 240px; height: 135px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    }
    .news-older__info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .news-older__item-title {
      font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #f59e0b;
      margin-bottom: 8px; line-height: 1.3;
    }
    .news-older__item-excerpt {
      font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #999;
      line-height: 1.5; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .news-older__item-date {
      font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; color: #555;
    }
    @media (max-width: 900px) {
      .news-layout { padding: 80px 40px 100px; }
      .news-older__img { width: 160px; height: 90px; }
    }
    @media (max-width: 600px) {
      .news-layout { padding: 80px 16px 60px; }
      .news-older__item { flex-direction: column; gap: 12px; }
      .news-older__img { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>

  <!-- ═══ NAVIGATION ═══ -->

      </a>
      <ul class="nav__links-vertical" id="navVertical">

        <li><a href="/events.html" class="nav__link--disabled">Events</a></li>
        <li><a href="/roadmap.html">Roadmap</a></li>
        <li><a href="/news.html" class="nav__link--active">News</a></li>
        <li><a href="https://drive.google.com/drive/folders/1cfloR6w46x5xEUgtgZoorzw0pTLA0Y2k?usp=sharing" target="_blank">Media Kit</a></li>
        <li><a href="/shop.html">Shop</a></li>

      <div class="nav__auth" id="navAuth">
        <a href="/auth/steam/login" class="nav__login-btn" id="loginBtn">
          <svg class="nav__login-steam" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 10.94l6.432 2.658a3.387 3.387 0 0 1 1.912-.588c.063 0 .125.002.188.006l2.861-4.142V8.77a4.508 4.508 0 0 1 4.502-4.502 4.508 4.508 0 0 1 4.502 4.502 4.508 4.508 0 0 1-4.502 4.502h-.105l-4.076 2.91c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396a3.406 3.406 0 0 1-3.345-2.81L.453 15.16A12.018 12.018 0 0 0 11.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12z"/></svg>
          Login
        </a>
        <div class="nav__profile" id="profileMenu" style="display:none;">
          <button class="nav__profile-btn" id="profileBtn">
            <img class="nav__profile-avatar" id="profileAvatar" src="" alt="" />
            <span id="profileBtnName"></span>
          </button>
          <span class="nav__profile-curr" id="profileCurr03"></span>
          <div class="nav__profile-dropdown" id="profileDropdown">
            <span class="nav__profile-name" id="profileName"></span>
            <a href="/profile.html" class="nav__profile-link">Character</a>
            <a href="/auth/steam/logout" class="nav__profile-logout">Logout</a>
          </div>
        </div>
      </div>
      <button class="nav__burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ═══ NEWS CONTENT ═══ -->
  <div class="news-layout" id="newsLayout">
    <p class="news-loading">Loading news...</p>
  </div>

  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__brand">
          <span class="footer__logo">OKUBI</span>
          <p class="footer__tagline">Forge Your Own Myth</p>
        </div>
        <div class="footer__links">
          <a href="/#features">Features</a>
          <a href="/roadmap.html">Roadmap</a>

        <div class="footer__social">
          <a href="https://discord.gg/okubi" target="_blank" aria-label="Discord">💬</a>
          <a href="https://twitter.com" target="_blank" aria-label="Twitter">𝕏</a>

      </div>
      <div class="footer__bottom">
        <p>&copy; 2026 OKUBI. All rights reserved. Powered by Unreal Engine 5.</p>
      </div>
    </div>
  </footer>

  <!-- ═══ BACK TO TOP ═══ -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Floating Playtest Status -->
  <a href="https://store.steampowered.com/app/2118100/OKUBI/" target="_blank" class="playtest-float" id="playtestFloat">
    <img src="assets/okubi-logo.png" alt="OKUBI" class="playtest-float__logo" />
    <span class="playtest-float__label">Playtest</span>
    <span class="playtest-float__status playtest-float__status--live" id="playtestStatus">LIVE</span>
  </a>

  <script src="script.js"></script>
  <script>
  (function() {
    fetch('/api/news').then(r => r.json()).then(items => {
      const layout = document.getElementById('newsLayout');
      if (!items.length) { layout.innerHTML = '<p class="news-loading">No news yet.</p>'; return; }

      let html = '';
      const featured = items[0];
      const side = items.slice(1, 3);
      const rest = items.slice(3);

      // Top row
      html += '<div class="news-top">';

      // Featured (big left card)
      html += `
        <a href="/article.html?slug=${featured.slug}" class="news-top__featured">
          <img class="news-top__featured-img" src="${featured.image || ''}" alt="" />
          <div class="news-top__featured-overlay"></div>
          <div class="news-top__featured-content">
            <div class="news-top__featured-date">${featured.displayDate || featured.date}</div>
            <h2 class="news-top__featured-title">${featured.title}</h2>
            <p class="news-top__featured-excerpt">${featured.excerpt}</p>
          </div>
        </a>
      `;

      // Side cards (stacked right)
      html += '<div class="news-top__side">';
      side.forEach(item => {
        html += `
          <a href="/article.html?slug=${item.slug}" class="news-side-card">
            <img class="news-side-card__img" src="${item.image || ''}" alt="" />
            <div class="news-side-card__overlay"></div>
            <div class="news-side-card__content">
              <div class="news-side-card__sub">${item.excerpt}</div>
              <h3 class="news-side-card__title">${item.title}</h3>
            </div>
          </a>
        `;
      });
      html += '</div></div>';

      // Bottom grid (first 3 after featured+side)
      const gridItems = rest.slice(0, 3);
      const olderItems = rest.slice(3);

      if (gridItems.length) {
        html += '<div class="news-bottom">';
        gridItems.forEach(item => {
          html += `
            <a href="/article.html?slug=${item.slug}" class="news-grid-card">
              <img class="news-grid-card__img" src="${item.image || ''}" alt="" />
              <div class="news-grid-card__overlay"></div>
              <div class="news-grid-card__content">
                <div class="news-grid-card__sub">${item.excerpt}</div>
                <h3 class="news-grid-card__title">${item.title}</h3>
              </div>
            </a>
          `;
        });
        html += '</div>';
      }

      // Older news (list style)
      if (olderItems.length) {
        html += '<div class="news-older">';
        html += '<div class="news-older__title">Previous Updates</div>';
        olderItems.forEach(item => {
          html += `
            <a href="/article.html?slug=${item.slug}" class="news-older__item">
              <img class="news-older__img" src="${item.image || ''}" alt="" />
              <div class="news-older__info">
                <h3 class="news-older__item-title">${item.title}</h3>
                <p class="news-older__item-excerpt">${item.excerpt}</p>
                <span class="news-older__item-date">${item.displayDate || item.date}</span>
              </div>
            </a>
          `;
        });
        html += '</div>';
      }

      layout.innerHTML = html;
    }).catch(() => {
      document.getElementById('newsLayout').innerHTML = '<p class="news-loading" style="color:#f88;">Failed to load news.</p>';
    });
  })();
  </script>
  <!-- Fixed bottom CTA -->
  <div class="fixed-cta" id="fixedCta">
    <a href="https://store.steampowered.com/app/2118100/OKUBI/" target="_blank" class="fixed-cta__btn fixed-cta__btn--gold">Wishlist Now</a>
    <a href="https://www.kickstarter.com/projects/grym-games/okubi" target="_blank" class="fixed-cta__btn fixed-cta__btn--kick">Kickstarter</a>
  </div>

  <style>
    .fixed-cta {
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 100%);
      padding: 20px 24px 28px;
    }
    .fixed-cta__btn {
      padding: 20px 80px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }
    .fixed-cta__btn--gold {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: var(--bg);
      border: 1px solid var(--gold);
      box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(212,168,83,0.15);
      animation: goldPulse 2.5s ease-in-out infinite;
    }
    .fixed-cta__btn--gold:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(212,168,83,0.3);
      transform: translateY(-2px);
    }
    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(212,168,83,0.15); }
      50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(212,168,83,0.25); }
    }
    .fixed-cta__btn--kick {
      background: rgba(10,9,8,0.6);
      color: #05c46b;
      border: 1px solid #05c46b;
      box-shadow: 0 0 16px rgba(5,196,107,0.2);
      backdrop-filter: blur(10px);
      padding: 20px 48px;
      animation: kickPulse 2.5s ease-in-out infinite;
    }
    .fixed-cta__btn--kick:hover {
      border-color: #2ecc71;
      color: #2ecc71;
      box-shadow: 0 0 30px rgba(5,196,107,0.35);
      transform: translateY(-2px);
    }
    @keyframes kickPulse {
      0%, 100% { box-shadow: 0 0 16px rgba(5,196,107,0.2); }
      50% { box-shadow: 0 0 24px rgba(5,196,107,0.35); }
    }
  </style>
</body>
</html>
