          Login

  <!-- ═══ ARTICLE HERO (full-screen image + title) ═══ -->

    <div class="article-hero__bg" id="articleHeroBg"></div>
    <div class="article-hero__overlay"></div>
    <div class="article-hero__content">
      <div class="article-hero__diamond">◆</div>
      <span class="article-hero__category" id="articleCategory">NEWS</span>
      <h1 class="article-hero__title" id="articleTitle"></h1>
    </div>
    <div class="article-hero__scroll">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
  </section>

  <!-- ═══ ARTICLE BODY (parallax polygon bg) ═══ -->
  <section class="article-body" id="articleBody">
    <!-- SVG polygon pattern background -->
    <div class="article-body__pattern"></div>
    <div class="article-body__container">
      <div class="article-body__meta">
        <time class="article-body__date" id="articleDate"></time>
      </div>
      <div class="article-body__content" id="articleContent">
        <!-- Content injected by JS -->
      </div>
      <div class="article-body__back">
        <a href="/news.html" class="article-body__back-link">← Back to Game Updates</a>
      </div>
    </div>
  </section>

  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__brand">

          <p class="footer__tagline">Forge Your Own Myth</p>
        </div>
        <div class="footer__links">

          <a href="/roadmap.html">Roadmap</a>

          <a href="/#community">Community</a>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <!-- Floating Playtest Status -->
  <a href="https://store.steampowered.com/app/2118100/OKUBI/" target="_blank" class="playtest-float" id="playtestFloat">
    <img src="assets/okubi-logo.png" alt="OKUBI" class="playtest-float__logo" />
    <span class="playtest-float__label">Playtest</span>
    <span class="playtest-float__status playtest-float__status--live" id="playtestStatus">LIVE</span>
  </a>

  <script src="script.js"></script>
  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    if (!slug) { window.location.href = '/news.html'; return; }

    fetch('/api/news/' + encodeURIComponent(slug))
      .then(function(r) { if (!r.ok) throw new Error('Not found'); return r.json(); })
      .then(function(article) {
        document.title = 'OKUBI \u2014 ' + article.title;
        document.getElementById('articleHeroBg').style.backgroundImage = "url('" + article.image + "')";
        document.getElementById('articleTitle').textContent = article.title;
        document.getElementById('articleCategory').textContent = article.category;
        document.getElementById('articleDate').textContent = article.displayDate || article.date;

        var contentEl = document.getElementById('articleContent');
        article.content.forEach(function(block) {
          if (block.type === 'text') {
            var p = document.createElement('p');
            p.className = 'article-body__text';
            p.textContent = block.value;
            contentEl.appendChild(p);
          } else if (block.type === 'heading') {
            var h2 = document.createElement('h2');
            h2.className = 'article-body__heading';
            h2.textContent = block.value;
            contentEl.appendChild(h2);
          } else if (block.type === 'list') {
            var ul = document.createElement('ul');
            ul.className = 'article-body__list';
            block.value.forEach(function(item) {
              var li = document.createElement('li');
              li.textContent = item;
              ul.appendChild(li);
            });
            contentEl.appendChild(ul);
          }
        });
      })
      .catch(function() { window.location.href = '/news.html'; });
  })();
  </script>

  <!-- Fixed bottom CTA -->
  <div class="fixed-cta">
    <a href="https://store.steampowered.com/app/2118100/OKUBI/" target="_blank" class="fixed-cta__btn fixed-cta__btn--gold">Wishlist Now</a>
    <a href="https://www.kickstarter.com/projects/grym-games/okubi" target="_blank" class="fixed-cta__btn fixed-cta__btn--outline">Kickstarter</a>
  </div>
</body>
</html>
